site_name: OpenShift Notes
site_url: https://openshift-ssa.github.io/openshift-notes
repo_url: https://github.com/openshift-ssa/openshift-notes
repo_name: openshift-ssa/openshift-notes

dev_addr: 127.0.0.1:8000

theme:
  name: material
  font:
    text: Red Hat Text
    code: Red Hat Mono
  palette:
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/external-links.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Prerequisites: prerequisites.md
  - Install: 
    - Install Host: install/install-host.md
    - Hub and Spoke: install/hub-spoke.md
    - Assisted Installer: install/assisted-installer.md
    - Agent Based Installer: install/agent-based-installer.md
  - Post Installation:
    - Banner: post-installation/banner.md
    - Storage: post-installation/storage.md
    - Registry Configuration: post-installation/registry-configuration.md
    - Networking: post-installation/networking.md
    - Advanced Cluster Management: post-installation/advanced-cluster-management.md
    - Virtualization: post-installation/virtualization.md
    - Certificates: post-installation/certificates.md
    - External Secrets: post-installation/external-secrets.md
  - Workloads: 
    - Containers: workloads/containers.md
    - Virtual Machines: workloads/virtual-machines.md
  - Functional Testing:
    - Node Failure: functional-testing/node-failure.md
  - Troubleshooting: troubleshooting.md
