site_name: OpenShift Notes
site_url: https://openshift-ssa.github.io/openshift-notes
repo_url: https://github.com/openshift-ssa/openshift-notes
repo_name: openshift-ssa/openshift-notes

dev_addr: 127.0.0.1:8000

theme:
  name: material
  font:
    text: Red Hat Text
    code: Red Hat Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Cluster Setup: cluster-setup/index.md
  - GitOps: gitops/index.md
  - Operators: operators/index.md
